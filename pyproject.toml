[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-flow"
version = "0.1.0"
description = "YAML-driven CLI orchestrator for repeatable command-line workflows"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.scripts]
cli-flow = "cli_flow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
